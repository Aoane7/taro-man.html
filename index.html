<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>タローマンのでたらめたたき</title>
  <style>
    :root{
      --panel:#fff7df;
      --ink:#171717;
      --accent:#d7261e;
      --shadow:0 10px 28px rgba(0,0,0,.18);
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      min-height:100%;
      margin:0;
      background:#f1e7cc;
      color:var(--ink);
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        system-ui,
        sans-serif;
    }

    body{
      min-height:100svh;
      overflow-x:hidden;
    }

    button,img{
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      -webkit-user-drag:none;
    }

    .screen{
      display:none;
      width:100%;
      min-height:100svh;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .screen.active{
      display:flex;
    }

    /* ---------- TOP ---------- */
    #topScreen{
      background:
        radial-gradient(circle at center, rgba(255,255,255,.45), transparent 48%),
        #ead9ad;
    }

    .top-wrap{
      width:min(920px, 96vw);
      text-align:center;
    }

    #topImage{
      display:block;
      width:min(760px, 94vw);
      max-height:82svh;
      object-fit:contain;
      margin:auto;
      cursor:pointer;
      filter:drop-shadow(0 14px 15px rgba(0,0,0,.2));
      transition:transform .12s ease;
    }

    #topImage:active{
      transform:scale(.985);
    }

    .tap-note{
      margin-top:10px;
      font-weight:900;
      letter-spacing:.08em;
      font-size:clamp(14px, 2vw, 20px);
      animation:blink 1.1s infinite;
    }

    @keyframes blink{
      50%{opacity:.35}
    }

    /* ---------- NANDA ---------- */
    #nandaOverlay{
      position:fixed;
      inset:0;
      z-index:999;
      display:none;
      align-items:center;
      justify-content:center;
      background:#000;
    }

    #nandaOverlay.show{
      display:flex;
    }

    #nandaOverlay img{
      width:min(900px, 100vw);
      max-height:100svh;
      object-fit:contain;
    }

    /* ---------- MODE SELECT ---------- */
    #modeScreen{
      background:
        repeating-linear-gradient(
          -15deg,
          #f3e7c8 0 24px,
          #ecddb6 24px 48px
        );
    }

    .mode-card{
      width:min(760px, 96vw);
      background:rgba(255,255,255,.86);
      border:6px solid #111;
      box-shadow:var(--shadow);
      padding:clamp(22px, 5vw, 50px);
      text-align:center;
    }

    .title{
      margin:0 0 28px;
      font-size:clamp(28px, 6vw, 60px);
      line-height:1.05;
      font-weight:1000;
    }

    .mode-buttons{
      display:grid;
      gap:20px;
    }

    .mode-button{
      min-height:88px;
      border:5px solid #111;
      background:#fff;
      color:#111;
      font-size:clamp(26px, 5vw, 48px);
      font-weight:1000;
      cursor:pointer;
      box-shadow:8px 8px 0 #111;
      transition:transform .08s, box-shadow .08s;
    }

    .mode-button:active:not(:disabled){
      transform:translate(6px,6px);
      box-shadow:2px 2px 0 #111;
    }

    .mode-button.primary{
      background:#fff3a8;
    }

    .mode-button:disabled{
      opacity:.52;
      cursor:not-allowed;
    }

    .soon{
      display:block;
      font-size:.36em;
      margin-top:3px;
      letter-spacing:.15em;
    }


    /* ---------- LEVEL SELECT ---------- */
    #levelScreen{
      background:
        repeating-linear-gradient(
          15deg,
          #f3e7c8 0 24px,
          #ecddb6 24px 48px
        );
    }

    .level-card{
      width:min(760px, 96vw);
      background:rgba(255,255,255,.9);
      border:6px solid #111;
      box-shadow:var(--shadow);
      padding:clamp(22px, 5vw, 50px);
      text-align:center;
    }

    .level-note{
      margin:-12px 0 24px;
      font-weight:900;
      font-size:clamp(16px, 2.5vw, 22px);
    }

    .level-buttons{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .level-button{
      min-height:100px;
      border:5px solid #111;
      background:#fff;
      color:#111;
      font-size:clamp(22px, 4vw, 36px);
      font-weight:1000;
      cursor:pointer;
      box-shadow:6px 6px 0 #111;
    }

    .level-button:nth-child(3){
      background:#fff3a8;
    }

    .level-button:active{
      transform:translate(4px,4px);
      box-shadow:2px 2px 0 #111;
    }

    .level-speed{
      display:block;
      margin-top:5px;
      font-size:.48em;
    }

    /* ---------- GAME ---------- */
    #gameScreen{
      align-items:flex-start;
      background:
        linear-gradient(#a7d9ff 0 58%, #d9c694 58% 100%);
      padding:10px;
    }

    .game-shell{
      width:min(1180px, 100%);
      margin:0 auto;
    }

    .hud{
      position:relative;
      min-height:88px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:8px 10px 10px;
      font-weight:1000;
    }

    .hud-left{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }

    .hud-box{
      border:4px solid #111;
      background:rgba(255,255,255,.9);
      padding:8px 14px;
      box-shadow:4px 4px 0 #111;
      font-size:clamp(18px, 2.8vw, 30px);
    }

    #lifeArea{
      display:flex;
      align-items:center;
      gap:6px;
      border:4px solid #111;
      background:rgba(255,255,255,.9);
      padding:6px 10px;
      box-shadow:4px 4px 0 #111;
    }

    .life-face{
      width:clamp(38px, 5.7vw, 64px);
      aspect-ratio:1;
      object-fit:contain;
      transition:opacity .16s, transform .16s;
    }

    .life-face.lost{
      opacity:0;
      transform:scale(.2) rotate(25deg);
    }

    .stage{
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(150px, 30%);
      align-items:end;
      gap:clamp(8px, 2vw, 24px);
      min-height:calc(100svh - 120px);
    }

    .holes{
      width:min(72vw, 720px);
      max-width:100%;
      aspect-ratio:1;
      align-self:center;
      justify-self:center;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);
      gap:clamp(7px, 1.5vw, 16px);
      padding:clamp(8px, 1.5vw, 16px);
    }

    .hole{
      position:relative;
      overflow:hidden;
      border-radius:50%;
      background:
        radial-gradient(ellipse at 50% 55%, #070707 0 50%, #292118 51% 62%, #735739 63% 70%, transparent 71%);
      touch-action:manipulation;
    }

    .character{
      position:absolute;
      left:50%;
      bottom:5%;
      width:86%;
      height:86%;
      object-fit:contain;
      transform:translate(-50%, 105%) scale(.88);
      transform-origin:50% 100%;
      cursor:pointer;
      animation:popUp .13s cubic-bezier(.2,.9,.3,1) forwards;
      filter:drop-shadow(0 5px 3px rgba(0,0,0,.28));
      z-index:5;
    }

    @keyframes popUp{
      to{transform:translate(-50%,0) scale(1)}
    }

    .character.hit{
      pointer-events:none;
      animation:hitAnim .16s ease-out forwards;
    }

    @keyframes hitAnim{
      to{
        transform:translate(-50%,10%) rotate(18deg) scale(.72);
        opacity:0;
      }
    }

    .building-zone{
      position:relative;
      min-width:0;
      display:flex;
      height:100%;
      align-items:flex-end;
      justify-content:center;
      padding-bottom:3vh;
    }

    #syatyoImage{
      position:absolute;
      left:50%;
      top:6%;
      z-index:8;
      display:none;
      width:min(72%, 220px);
      max-height:30svh;
      object-fit:contain;
      transform:translateX(-50%);
      filter:drop-shadow(0 7px 5px rgba(0,0,0,.28));
      pointer-events:none;
    }

    #syatyoImage.show{
      display:block;
      animation:syatyoPop .22s ease-out;
    }

    @keyframes syatyoPop{
      0%{transform:translateX(-50%) scale(.3); opacity:0}
      70%{transform:translateX(-50%) scale(1.12); opacity:1}
      100%{transform:translateX(-50%) scale(1); opacity:1}
    }

    #buildingImage{
      display:block;
      width:min(100%, 330px);
      max-height:72svh;
      object-fit:contain;
      transform-origin:50% 100%;
      filter:drop-shadow(0 10px 8px rgba(0,0,0,.22));
    }

    #buildingImage.shake{
      animation:buildingShake .52s ease-in-out;
    }

    @keyframes buildingShake{
      0%,100%{transform:translateX(0) rotate(0)}
      12%{transform:translateX(-10px) rotate(-2deg)}
      24%{transform:translateX(10px) rotate(2deg)}
      36%{transform:translateX(-9px) rotate(-2deg)}
      48%{transform:translateX(8px) rotate(1.6deg)}
      62%{transform:translateX(-6px) rotate(-1deg)}
      78%{transform:translateX(4px) rotate(.8deg)}
    }

    #buildingImage.destroyed{
      animation:destroyBoom .55s ease-out;
    }

    @keyframes destroyBoom{
      0%{transform:scale(1)}
      25%{transform:scale(1.08) rotate(-3deg)}
      50%{transform:scale(.96) rotate(3deg)}
      75%{transform:scale(1.04) rotate(-1deg)}
      100%{transform:scale(1)}
    }

    .floating-score{
      position:absolute;
      z-index:20;
      left:50%;
      top:25%;
      transform:translateX(-50%);
      font-weight:1000;
      font-size:clamp(18px, 4vw, 38px);
      color:#fff;
      text-shadow:
        3px 3px 0 #111,
        -2px -2px 0 #111,
        2px -2px 0 #111,
        -2px 2px 0 #111;
      pointer-events:none;
      animation:scoreFly .55s ease-out forwards;
    }

    @keyframes scoreFly{
      to{transform:translate(-50%,-55px) scale(1.25); opacity:0}
    }

    /* ---------- RESULT ---------- */
    #resultScreen{
      background:
        radial-gradient(circle at top, #fff1a8, #e9d8aa 62%, #d1b97f);
      align-items:flex-start;
      overflow:auto;
    }

    .result-card{
      width:min(850px, 96vw);
      margin:18px auto;
      padding:clamp(18px, 4vw, 36px);
      background:rgba(255,255,255,.9);
      border:6px solid #111;
      box-shadow:var(--shadow);
      text-align:center;
    }

    .result-card h1{
      margin:0 0 20px;
      font-size:clamp(32px, 7vw, 62px);
    }

    .result-sub{
      margin:8px 0 18px;
      font-size:clamp(18px, 3vw, 28px);
      font-weight:900;
    }

    #bestList{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:18px;
      margin:18px 0 28px;
    }

    .best-item{
      min-width:170px;
      background:#fff8d4;
      border:4px solid #111;
      padding:14px;
      box-shadow:5px 5px 0 #111;
    }

    .best-item img{
      width:130px;
      height:130px;
      object-fit:contain;
      display:block;
      margin:0 auto 6px;
    }

    .best-count{
      font-size:clamp(24px, 4vw, 36px);
      font-weight:1000;
    }

    .destroy-result{
      border-top:4px dashed #111;
      border-bottom:4px dashed #111;
      padding:18px 6px;
      margin:18px 0 24px;
      font-size:clamp(22px, 4vw, 36px);
      font-weight:1000;
    }

    .result-buttons{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:14px;
    }

    .small-button{
      border:4px solid #111;
      background:#fff;
      color:#111;
      padding:12px 22px;
      font-size:clamp(18px, 3vw, 26px);
      font-weight:1000;
      cursor:pointer;
      box-shadow:4px 4px 0 #111;
    }

    .small-button:active{
      transform:translate(3px,3px);
      box-shadow:1px 1px 0 #111;
    }

    @media (max-width:700px){
      .screen{padding:8px}

      .hud{
        min-height:72px;
        padding:4px;
      }

      .hud-box{
        border-width:3px;
        padding:6px 8px;
        box-shadow:2px 2px 0 #111;
      }

      #lifeArea{
        gap:2px;
        border-width:3px;
        padding:4px 5px;
        box-shadow:2px 2px 0 #111;
      }

      .stage{
        grid-template-columns:minmax(0, 74%) minmax(90px, 26%);
        gap:2px;
        min-height:calc(100svh - 88px);
      }

      .holes{
        width:100%;
        padding:4px;
        gap:5px;
      }

      #buildingImage{
        max-height:60svh;
      }
    }
  </style>
</head>

<body>

  <!-- TOP -->
  <section id="topScreen" class="screen active">
    <div class="top-wrap">
      <img id="topImage" src="images/top.png" alt="タローマンのでたらめたたき">
      <div class="tap-note">画像をタッチ</div>
    </div>
  </section>

  <!-- nanda.png 2秒演出 -->
  <div id="nandaOverlay" aria-hidden="true">
    <img src="images/nanda.png" alt="">
  </div>

  <!-- モード選択 -->
  <section id="modeScreen" class="screen">
    <div class="mode-card">
      <h1 class="title">タローマンの<br>でたらめたたき</h1>

      <div class="mode-buttons">
        <button id="normalModeButton" class="mode-button primary">
          じょうしき
        </button>

        <button class="mode-button" disabled>
          でたらめ
          <span class="soon">COMING SOON</span>
        </button>
      </div>
    </div>
  </section>

  <!-- じょうしきモード レベル選択 -->
  <section id="levelScreen" class="screen">
    <div class="level-card">
      <h1 class="title">じょうしき</h1>
      <p class="level-note">レベルをえらべ</p>

      <div class="level-buttons">
        <button class="level-button" data-level="1">
          レベル1
          <span class="level-speed">速度 35%</span>
        </button>
        <button class="level-button" data-level="2">
          レベル2
          <span class="level-speed">速度 70%</span>
        </button>
        <button class="level-button" data-level="3">
          レベル3
          <span class="level-speed">速度 100%</span>
        </button>
      </div>

      <div style="margin-top:24px">
        <button id="levelBackButton" class="small-button">もどる</button>
      </div>
    </div>
  </section>

  <!-- ゲーム -->
  <section id="gameScreen" class="screen">
    <main class="game-shell">
      <div class="hud">
        <div class="hud-left">
          <div class="hud-box">
            のこり <span id="timeText">60</span> 秒
          </div>
          <div class="hud-box">
            とくてん <span id="scoreText">0</span>
          </div>
          <div class="hud-box">
            Lv.<span id="levelText">3</span>
          </div>
        </div>

        <div id="lifeArea" aria-label="ライフ">
          <img class="life-face" src="images/face.png" alt="ライフ">
          <img class="life-face" src="images/face.png" alt="ライフ">
          <img class="life-face" src="images/face.png" alt="ライフ">
        </div>
      </div>

      <div class="stage">
        <div id="holes" class="holes">
          <div class="hole"></div>
          <div class="hole"></div>
          <div class="hole"></div>
          <div class="hole"></div>
          <div class="hole"></div>
          <div class="hole"></div>
          <div class="hole"></div>
          <div class="hole"></div>
          <div class="hole"></div>
        </div>

        <div class="building-zone">
          <img id="syatyoImage" src="images/syatyo.png" alt="">
          <img id="buildingImage" src="images/bill.png" alt="ビル">
        </div>
      </div>
    </main>
  </section>

  <!-- リザルト -->
  <section id="resultScreen" class="screen">
    <div class="result-card">
      <h1>けっか</h1>
      <p class="result-sub">いちばん多くたたいたのは……</p>

      <div id="bestList"></div>

      <div class="destroy-result">
        ビルをこわした回数<br>
        <span id="destroyCountText">0</span> 回
      </div>

      <div class="result-buttons">
        <button id="retryButton" class="small-button">もういちど</button>
        <button id="topButton" class="small-button">トップへ</button>
      </div>
    </div>
  </section>

  <!-- Audio -->
  <audio id="topBgm" src="sounds/top.mp3" preload="auto" loop></audio>
  <audio id="nandaSound" src="sounds/nanda.mp3" preload="auto"></audio>
  <audio id="hakaiSound" src="sounds/hakai.mp3" preload="auto"></audio>
  <audio id="syatyoSound" src="sounds/syatyo.mp3" preload="auto"></audio>
  <audio id="damageSound" src="sounds/damage.mp3" preload="auto"></audio>
  <audio id="kekkaSound" src="sounds/kekka.mp3" preload="auto"></audio>

  <script>
    (() => {
      "use strict";

      /* =========================================================
         基本設定
      ========================================================= */
      const GAME_SECONDS = 60;

      // レベル3を基準速度(100%)とする
      const BASE_SPAWN_INTERVAL_MS = 470;
      const BASE_APPEAR_MIN_MS = 680;
      const BASE_APPEAR_MAX_MS = 1080;

      // speed: レベル3比。レベル2=70%、レベル1=35%
      const LEVEL_SETTINGS = {
        1: { speed: 0.35, label: "レベル1" },
        2: { speed: 0.70, label: "レベル2" },
        3: { speed: 1.00, label: "レベル3" }
      };

      // ビル破壊後、hakai.jpg と syatyo.png を3秒表示して元に戻るまで
      const BUILDING_RESET_MS = 3000;

      const CHARACTER_COUNT = 10;

      /* =========================================================
         DOM
      ========================================================= */
      const screens = {
        top: document.getElementById("topScreen"),
        mode: document.getElementById("modeScreen"),
        level: document.getElementById("levelScreen"),
        game: document.getElementById("gameScreen"),
        result: document.getElementById("resultScreen")
      };

      const topImage = document.getElementById("topImage");
      const nandaOverlay = document.getElementById("nandaOverlay");
      const normalModeButton = document.getElementById("normalModeButton");
      const levelButtons = [...document.querySelectorAll(".level-button[data-level]")];
      const levelBackButton = document.getElementById("levelBackButton");

      const holesContainer = document.getElementById("holes");
      const holes = [...holesContainer.querySelectorAll(".hole")];

      const timeText = document.getElementById("timeText");
      const scoreText = document.getElementById("scoreText");
      const levelText = document.getElementById("levelText");
      const lifeFaces = [...document.querySelectorAll(".life-face")];
      const buildingImage = document.getElementById("buildingImage");
      const syatyoImage = document.getElementById("syatyoImage");

      const bestList = document.getElementById("bestList");
      const destroyCountText = document.getElementById("destroyCountText");
      const retryButton = document.getElementById("retryButton");
      const topButton = document.getElementById("topButton");

      const topBgm = document.getElementById("topBgm");
      const nandaSound = document.getElementById("nandaSound");
      const hakaiSound = document.getElementById("hakaiSound");
      const syatyoSound = document.getElementById("syatyoSound");
      const damageSound = document.getElementById("damageSound");
      const kekkaSound = document.getElementById("kekkaSound");

      /* =========================================================
         ゲーム状態
      ========================================================= */
      let gameRunning = false;
      let currentLevel = 3;
      let score = 0;
      let lives = 3;
      let buildingDestroyCount = 0;

      // 1.png～10.png を何回叩いたか
      let hitCounts = Array(CHARACTER_COUNT + 1).fill(0);

      let spawnTimer = null;
      let clockTimer = null;
      let buildingResetTimer = null;
      let gameEndAt = 0;

      // 各穴の現在のキャラ
      // { img, number, hit, disappearTimer }
      const activeCharacters = Array(9).fill(null);

      /* =========================================================
         画面切り替え
      ========================================================= */
      function showScreen(name) {
        Object.values(screens).forEach(screen => {
          screen.classList.remove("active");
        });
        screens[name].classList.add("active");
      }

      /* =========================================================
         音声
      ========================================================= */
      function safePlay(audio, restart = false) {
        if (restart) {
          try { audio.currentTime = 0; } catch (_) {}
        }

        const promise = audio.play();
        if (promise && typeof promise.catch === "function") {
          promise.catch(() => {
            // ブラウザの自動再生制限などの場合は何もしない
          });
        }
      }

      function stopAudio(audio) {
        audio.pause();
        try { audio.currentTime = 0; } catch (_) {}
      }

      // 初回表示時に top.mp3 の自動再生を試す
      safePlay(topBgm);

      // ブラウザで自動再生が拒否された場合、
      // 最初のユーザー操作で再生を再試行する。
      function unlockTopAudio() {
        if (screens.top.classList.contains("active") && topBgm.paused) {
          safePlay(topBgm);
        }
      }

      document.addEventListener("pointerdown", unlockTopAudio, { passive: true });

      /* =========================================================
         TOP → nanda.png → モード選択
      ========================================================= */
      let topTransitioning = false;

      topImage.addEventListener("click", () => {
        if (topTransitioning) return;
        topTransitioning = true;

        stopAudio(topBgm);

        screens.top.classList.remove("active");
        nandaOverlay.classList.add("show");
        nandaOverlay.setAttribute("aria-hidden", "false");

        safePlay(nandaSound, true);

        setTimeout(() => {
          nandaOverlay.classList.remove("show");
          nandaOverlay.setAttribute("aria-hidden", "true");
          showScreen("mode");
          topTransitioning = false;
        }, 2000);
      });

      /* =========================================================
         じょうしきモード開始
      ========================================================= */
      normalModeButton.addEventListener("click", () => {
        showScreen("level");
      });

      levelBackButton.addEventListener("click", () => {
        showScreen("mode");
      });

      levelButtons.forEach(button => {
        button.addEventListener("click", () => {
          currentLevel = Number(button.dataset.level);
          startNormalGame();
        });
      });

      retryButton.addEventListener("click", startNormalGame);

      topButton.addEventListener("click", () => {
        stopGameTimers();
        clearAllCharacters(false);
        syatyoImage.classList.remove("show");
        stopAudio(syatyoSound);
        stopAudio(damageSound);
        stopAudio(kekkaSound);

        showScreen("top");
        safePlay(topBgm, true);
      });

      function startNormalGame() {
        stopAudio(nandaSound);
        stopAudio(hakaiSound);
        stopAudio(syatyoSound);
        stopAudio(damageSound);
        stopAudio(kekkaSound);

        // ゲーム中もトップBGMをループ再生
        safePlay(topBgm, true);

        stopGameTimers();
        clearAllCharacters(false);

        gameRunning = true;
        score = 0;
        lives = 3;
        buildingDestroyCount = 0;
        hitCounts = Array(CHARACTER_COUNT + 1).fill(0);

        scoreText.textContent = "0";
        timeText.textContent = String(GAME_SECONDS);
        levelText.textContent = String(currentLevel);

        syatyoImage.classList.remove("show");
        buildingImage.src = "images/bill.png";
        buildingImage.classList.remove("shake", "destroyed");

        updateLives();

        showScreen("game");

        gameEndAt = performance.now() + GAME_SECONDS * 1000;

        // 最初の1体はすぐ出す
        spawnCharacter();

        const levelSpeed = LEVEL_SETTINGS[currentLevel].speed;
        const spawnIntervalMs = BASE_SPAWN_INTERVAL_MS / levelSpeed;

        spawnTimer = setInterval(() => {
          if (gameRunning) spawnCharacter();
        }, spawnIntervalMs);

        clockTimer = setInterval(updateClock, 100);
      }

      /* =========================================================
         キャラ出現
      ========================================================= */
      function spawnCharacter() {
        if (!gameRunning) return;

        const emptyHoleIndexes = [];

        activeCharacters.forEach((active, index) => {
          if (!active) emptyHoleIndexes.push(index);
        });

        // 全穴が使用中なら今回は出さない
        if (emptyHoleIndexes.length === 0) return;

        const holeIndex =
          emptyHoleIndexes[
            Math.floor(Math.random() * emptyHoleIndexes.length)
          ];

        const characterNumber =
          Math.floor(Math.random() * CHARACTER_COUNT) + 1;

        const hole = holes[holeIndex];
        const img = document.createElement("img");

        img.className = "character";
        img.src = `images/${characterNumber}.png`;
        img.alt = `${characterNumber}`;
        img.draggable = false;

        const active = {
          img,
          number: characterNumber,
          hit: false,
          disappearTimer: null
        };

        activeCharacters[holeIndex] = active;
        hole.appendChild(img);

        img.addEventListener("pointerdown", event => {
          event.preventDefault();
          hitCharacter(holeIndex);
        }, { once: true });

        const levelSpeed = LEVEL_SETTINGS[currentLevel].speed;
        const appearMinMs = BASE_APPEAR_MIN_MS / levelSpeed;
        const appearMaxMs = BASE_APPEAR_MAX_MS / levelSpeed;

        const visibleMs =
          appearMinMs +
          Math.random() * (appearMaxMs - appearMinMs);

        active.disappearTimer = setTimeout(() => {
          removeCharacter(holeIndex, true);
        }, visibleMs);
      }

      /* =========================================================
         キャラを叩いた
      ========================================================= */
      function hitCharacter(holeIndex) {
        if (!gameRunning) return;

        const active = activeCharacters[holeIndex];
        if (!active || active.hit) return;

        active.hit = true;

        clearTimeout(active.disappearTimer);

        score += 1;
        hitCounts[active.number] += 1;

        scoreText.textContent = String(score);

        active.img.classList.add("hit");
        showFloatingScore(holes[holeIndex]);

        setTimeout(() => {
          removeCharacter(holeIndex, false);
        }, 150);
      }

      function showFloatingScore(hole) {
        const el = document.createElement("div");
        el.className = "floating-score";
        el.textContent = "+1";
        hole.appendChild(el);

        setTimeout(() => el.remove(), 600);
      }

      /* =========================================================
         キャラが消える
         missed=true の時、
         1.png / 2.png だけ叩き逃し判定
      ========================================================= */
      function removeCharacter(holeIndex, missed) {
        const active = activeCharacters[holeIndex];
        if (!active) return;

        clearTimeout(active.disappearTimer);

        if (
          gameRunning &&
          missed &&
          !active.hit &&
          (active.number === 1 || active.number === 2)
        ) {
          loseLife();
        }

        if (active.img && active.img.parentNode) {
          active.img.remove();
        }

        activeCharacters[holeIndex] = null;
      }

      /* =========================================================
         ライフ / ビル
      ========================================================= */
      function loseLife() {
        if (!gameRunning) return;

        // 破壊演出中は重複してライフを削らない
        if (buildingResetTimer) return;

        lives = Math.max(0, lives - 1);
        updateLives();

        // ライフが1つ減るたびにダメージ音
        safePlay(damageSound, true);

        shakeBuilding();

        if (lives <= 0) {
          destroyBuilding();
        }
      }

      function updateLives() {
        lifeFaces.forEach((face, index) => {
          face.classList.toggle("lost", index >= lives);
        });
      }

      function shakeBuilding() {
        buildingImage.classList.remove("shake");

        // 同じclassのアニメーションを連続発火させるためreflow
        void buildingImage.offsetWidth;

        buildingImage.classList.add("shake");

        setTimeout(() => {
          buildingImage.classList.remove("shake");
        }, 550);
      }

      function destroyBuilding() {
        if (!gameRunning || buildingResetTimer) return;

        buildingDestroyCount += 1;

        buildingImage.classList.remove("shake");
        buildingImage.src = "images/hakai.jpg";

        // ビル上部に社長をオーバーレイ表示
        syatyoImage.classList.remove("show");
        void syatyoImage.offsetWidth;
        syatyoImage.classList.add("show");

        void buildingImage.offsetWidth;
        buildingImage.classList.add("destroyed");

        // 破壊音と社長音声を同時再生
        safePlay(hakaiSound, true);
        safePlay(syatyoSound, true);

        buildingResetTimer = setTimeout(() => {
          buildingResetTimer = null;

          syatyoImage.classList.remove("show");

          if (!gameRunning) return;

          buildingImage.classList.remove("destroyed");
          buildingImage.src = "images/bill.png";

          // 何事もなかったかのように復活
          lives = 3;
          updateLives();
        }, BUILDING_RESET_MS);
      }

      /* =========================================================
         60秒タイマー
      ========================================================= */
      function updateClock() {
        if (!gameRunning) return;

        const remainMs = Math.max(0, gameEndAt - performance.now());
        const remainSeconds = Math.ceil(remainMs / 1000);

        timeText.textContent = String(remainSeconds);

        if (remainMs <= 0) {
          finishGame();
        }
      }

      /* =========================================================
         ゲーム終了
      ========================================================= */
      function finishGame() {
        if (!gameRunning) return;

        gameRunning = false;
        timeText.textContent = "0";

        stopGameTimers();
        clearAllCharacters(false);

        // ゲームBGMを止め、リザルト音声を再生
        stopAudio(topBgm);
        safePlay(kekkaSound, true);

        showResult();
      }

      function stopGameTimers() {
        if (spawnTimer) {
          clearInterval(spawnTimer);
          spawnTimer = null;
        }

        if (clockTimer) {
          clearInterval(clockTimer);
          clockTimer = null;
        }

        if (buildingResetTimer) {
          clearTimeout(buildingResetTimer);
          buildingResetTimer = null;
        }
      }

      function clearAllCharacters(countAsMiss = false) {
        activeCharacters.forEach((active, index) => {
          if (!active) return;

          clearTimeout(active.disappearTimer);

          if (countAsMiss) {
            removeCharacter(index, true);
          } else {
            if (active.img && active.img.parentNode) {
              active.img.remove();
            }
            activeCharacters[index] = null;
          }
        });

        holes.forEach(hole => {
          hole.querySelectorAll(".floating-score").forEach(el => el.remove());
        });
      }

      /* =========================================================
         リザルト
         最も多く叩いた画像を「画像 × 回数」で表示
         同率1位なら複数表示
      ========================================================= */
      function showResult() {
        bestList.innerHTML = "";

        const maxHits = Math.max(...hitCounts.slice(1));

        if (maxHits <= 0) {
          const empty = document.createElement("div");
          empty.className = "best-item";
          empty.innerHTML = `
            <div class="best-count">だれも<br>たたいていない</div>
          `;
          bestList.appendChild(empty);
        } else {
          for (let number = 1; number <= CHARACTER_COUNT; number++) {
            if (hitCounts[number] !== maxHits) continue;

            const item = document.createElement("div");
            item.className = "best-item";

            const img = document.createElement("img");
            img.src = `images/${number}.png`;
            img.alt = `${number}.png`;

            const count = document.createElement("div");
            count.className = "best-count";
            count.textContent = `× ${hitCounts[number]} 回`;

            item.appendChild(img);
            item.appendChild(count);
            bestList.appendChild(item);
          }
        }

        destroyCountText.textContent = String(buildingDestroyCount);

        showScreen("result");
      }

    })();
  </script>
</body>
</html>
